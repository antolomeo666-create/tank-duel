<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tank Duel – 1v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 30%,#1b2128,#07090c);color:#e8e8e8;font-family:system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:100vh;padding:10px 0}
  #wrap{position:relative;width:min(96vw,calc(84vh*1.6));aspect-ratio:1200/750;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px #ffffff14,0 20px 60px #000c}
  canvas#c{display:block;width:100%;height:100%;background:#0b0d11}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,8,11,.55);overflow:auto;padding:14px}
  .hidden{display:none!important}
  .mcard{background:rgba(13,17,23,.93);border:1px solid #ffffff1c;border-radius:16px;padding:18px 22px 16px;max-width:100%;box-shadow:0 20px 60px #000a;margin:auto}
  header{display:flex;align-items:baseline;gap:16px;margin-bottom:12px;flex-wrap:wrap}
  h1{font-family:'Black Ops One',Impact,sans-serif;font-weight:400;font-size:46px;line-height:1;margin:0;color:#f1e6c8;letter-spacing:1px}
  header p{margin:0;color:#9aa4ae;font-size:14px}
  .cols{display:flex;gap:22px;flex-wrap:wrap}
  .opts{flex:0 0 330px;display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:10px}
  .row label{width:74px;font-size:13px;color:#aab3bc;font-weight:600}
  .seg{display:flex;background:#0a0d12;border:1px solid #ffffff17;border-radius:9px;padding:3px;gap:2px;flex:1}
  .seg button{flex:1;border:0;background:none;color:#c9d1d9;font:600 12.5px system-ui;padding:7px 4px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .seg button:hover{background:#ffffff0d}
  .seg button.on{background:#ffd54f;color:#1a1500}
  button:focus-visible,input:focus-visible{outline:2px solid #ffd54f;outline-offset:2px}
  .online{margin-top:4px;background:#0a0d12;border:1px solid #ffffff17;border-radius:10px;padding:10px}
  .netrow{display:flex;gap:8px;align-items:center}
  .netrow span{color:#7d8790;font-size:12px}
  #code{width:74px;background:#141a22;border:1px solid #ffffff22;border-radius:7px;color:#fff;font:700 15px monospace;padding:7px;text-transform:uppercase;text-align:center;letter-spacing:2px}
  .btn{background:#222a35;color:#e8e8e8;border:1px solid #ffffff22;border-radius:8px;font:600 13px system-ui;padding:8px 12px;cursor:pointer}
  .btn:hover{background:#2c3644}
  #netStatus{font-size:12.5px;color:#b9c3cc;margin-top:8px;line-height:1.45;min-height:18px}
  #netStatus.bad{color:#ff9e9e}
  #netStatus .code{color:#ffd54f;font-family:monospace;font-size:15px;letter-spacing:2px}
  .note{font-size:11.5px;color:#7d8790;margin:6px 0 0}
  .tanks h3{margin:0 0 6px;font:600 13px system-ui;color:#aab3bc}
  .picker{display:flex;gap:8px;margin-bottom:10px}
  .tcard{width:112px;background:#0a0d12;border:1px solid #ffffff17;border-radius:10px;padding:6px 8px 8px;color:#e8e8e8;cursor:pointer;text-align:left;display:flex;flex-direction:column;align-items:stretch}
  .tcard:hover{border-color:#ffffff40}
  .tcard.on{border-color:#ffd54f;box-shadow:0 0 0 1px #ffd54f inset;background:#16140a}
  .tcard canvas{width:72px;height:75px;align-self:center}
  .tcard b{font:15px 'Black Ops One',Impact,sans-serif;font-weight:400;margin-top:2px}
  .tcard small{font-size:10.5px;color:#8f99a3;line-height:1.25;min-height:26px;margin:1px 0 4px}
  .stat{display:flex;align-items:center;gap:5px;font-size:9.5px;color:#8f99a3;margin-top:2px}
  .stat span{width:44px}
  .stat i{flex:1;height:4px;background:#ffffff14;border-radius:2px;position:relative;overflow:hidden}
  .stat i::after{content:"";position:absolute;inset:0;width:var(--v);background:#ffd54f;border-radius:2px}
  footer{display:flex;align-items:center;gap:14px;margin-top:6px}
  .primary{background:#ffd54f;color:#1a1500;border:0;border-radius:10px;font:20px 'Black Ops One',Impact,sans-serif;padding:11px 30px;cursor:pointer;letter-spacing:1px}
  .primary:hover{background:#ffe17a}
  .primary:disabled{background:#3a3a30;color:#8a8a70;cursor:default}
  .hint{color:#7d8790;font-size:12px}
  .pcard{background:rgba(13,17,23,.95);border:1px solid #ffffff1c;border-radius:16px;padding:24px 34px;display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:260px;text-align:center}
  .pcard h2{font:40px 'Black Ops One',Impact,sans-serif;font-weight:400;margin:0 0 4px;color:#f1e6c8}
  .pcard p{margin:0;color:#9aa4ae;font-size:13px}
  #toast{position:absolute;left:50%;bottom:22px;transform:translate(-50%,20px);background:rgba(12,15,20,.92);border:1px solid #ffffff22;border-radius:10px;padding:9px 16px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .help{margin-top:12px;font-size:13px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:96vw}
  .help div{background:#ffffff0a;border:1px solid #ffffff14;border-radius:10px;padding:7px 12px}
  .help .p1 b{color:#8fd8ff}.help .p2 b{color:#ffad8a}.help .pad b{color:#c5e1a5}.help .misc{color:#9aa4ae}
  kbd{background:#2a313c;border-radius:4px;padding:1px 6px;font-family:monospace;color:#fff;border-bottom:2px solid #11151b;font-size:12px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1200" height="750"></canvas>
  <div id="menu" class="overlay">
    <div class="mcard">
      <header><h1>TANK DUEL</h1><p>Top-down 1v1 tank battles · first to 3 rounds wins</p></header>
      <div class="cols">
        <section class="opts">
          <div class="row"><label>Mode</label><div class="seg" data-opt="mode"><button data-v="local">2 Players</button><button data-v="cpu">vs CPU</button><button data-v="online">Online</button></div></div>
          <div class="row" data-show="cpu"><label>CPU level</label><div class="seg" data-opt="diff"><button data-v="easy">Easy</button><button data-v="medium">Medium</button><button data-v="hard">Hard</button></div></div>
          <div class="row"><label>Map</label><div class="seg" data-opt="map"><button data-v="random">Random</button><button data-v="grass">Grass</button><button data-v="desert">Desert</button><button data-v="winter">Winter</button></div></div>
          <div class="row"><label>Turret</label><div class="seg" data-opt="turret"><button data-v="fixed">Fixed</button><button data-v="free">Free aim</button></div></div>
          <div class="row"><label>Aim line</label><div class="seg" data-opt="aim"><button data-v="on">On</button><button data-v="off">Off (hard mode)</button></div></div>
          <div class="row"><label>Sound</label><div class="seg" data-opt="sound"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
          <div class="online" data-show="online">
            <div class="netrow"><button id="host" class="btn">Host game</button><span>or</span><input id="code" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false"><button id="join" class="btn">Join</button></div>
            <div id="netStatus"></div>
            <p class="note">The host's map, turret and aim-line settings are used.</p>
          </div>
        </section>
        <section class="tanks">
          <h3 id="p1label">Blue tank</h3><div class="picker" data-opt="p1"></div>
          <div data-show="local cpu"><h3 id="p2label">Orange tank</h3><div class="picker" data-opt="p2"></div></div>
        </section>
      </div>
      <footer><button id="start" class="primary">START</button><span class="hint">Space · Enter · controller Start</span></footer>
    </div>
  </div>
  <div id="pause" class="overlay hidden">
    <div class="pcard"><h2>PAUSED</h2><p id="pauseNote"></p><button id="resume" class="primary">Resume</button><button id="quit" class="btn">Quit to menu</button></div>
  </div>
  <div id="toast"></div>
</div>
<div id="help" class="help"></div>
<script src="js/maps.js"></script>
<script src="js/audio.js"></script>
<script src="js/gfx.js"></script>
<script src="js/ai.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
</body>
</html>
